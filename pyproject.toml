[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "film-poc"
version = "0.6.0"
description = "Minimal desktop RAW film emulation for Windows and macOS"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy==2.5.4", "Pillow==13.0.0", "rawpy==0.27.1; sys_platform != 'darwin' or platform_machine != 'x86_64'", "rawpy==0.25.1; sys_platform == 'darwin' and platform_machine == 'x86_64'", "PySide6-Essentials==6.12.0", "scipy==1.18.1"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "build>=1.2", "ruff>=0.6", "pyinstaller>=6.10"]

[project.gui-scripts]
film-poc = "film_poc.ui:main"

[tool.setuptools.packages.find]
include = ["film_poc*"]

[tool.setuptools.package-data]
film_poc = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["film_poc/core/profiles.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"film_poc/core/profile_transforms.py" = ["E501", "E741"]
"film_poc/ui/theme.py" = ["E501"]
